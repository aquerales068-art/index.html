<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Sistema</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #001f3f; /* Azul Marino */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff; /* Blanco */
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            border-top: 5px solid #001122;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #001f3f; /* Azul Marino */
            font-size: 22px;
            margin-bottom: 25px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #001f3f;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #f8fafc;
            color: #1e293b;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #001f3f;
            background-color: #ffffff;
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #64748b;
            font-size: 18px;
            user-select: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #001f3f; /* Azul Marino */
            color: white; /* Blanco */
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #001122;
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .instruction-text {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* --- ANIMACIONES --- */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #001f3f;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .clock-container {
            position: relative;
            width: 60px;
            height: 60px;
            border: 4px solid #001f3f;
            border-radius: 50%;
            margin: 20px auto;
            background-color: #ffffff;
        }
        .clock-hand {
            position: absolute;
            width: 4px;
            background-color: #001f3f;
            border-radius: 2px;
            transform-origin: bottom center;
            left: calc(50% - 2px);
        }
        .hour-hand {
            height: 14px;
            top: 16px;
            animation: rotateHand 12s linear infinite;
        }
        .minute-hand {
            height: 20px;
            top: 10px;
            animation: rotateHand 1s linear infinite;
        }
        @keyframes rotateHand {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PASO 1: LOGIN -->
    <div id="step1" class="step active">
        <h2>Ingreso al Sistema</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" required placeholder="Ej. correo o identificación">
            </div>
            
            <div class="input-group">
                <label for="contrasena">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="contrasena" required placeholder="Introduce tu clave">
                    <span class="toggle-password" id="eyeIcon">👁️‍🗨️</span>
                </div>
            </div>
            
            <button type="submit" id="btnSiguiente">Siguiente</button>
        </form>
    </div>

    <!-- PASO 2: CÓDIGO DE VERIFICACIÓN -->
    <div id="step2" class="step">
        <h2>Verificación de Seguridad</h2>
        <p class="instruction-text">Por favor, pon el código de 6 dígitos que hemos enviado a tu correo o número de celular para continuar.</p>
        
        <form id="codeForm">
            <div class="input-group">
                <input type="text" id="codigoVerificacion" inputmode="numeric" pattern="\d*" maxlength="6" required placeholder="000000" style="text-align: center; font-size: 24px; letter-spacing: 8px;">
            </div>
            
            <button type="submit" id="btnFinalizar">Verificar</button>
        </form>
    </div>

    <!-- PASO DE CARGA INTERMEDIO (5 SEGUNDOS) -->
    <div id="stepLoading" class="step">
        <h2>Procesando</h2>
        <p class="instruction-text">Validando el código de seguridad introducido...</p>
        <div class="spinner"></div>
    </div>

    <!-- PASO FIN: ESTADO FINAL -->
    <div id="stepFinal" class="step">
        <h2>Estado del Proceso</h2>
        <div class="clock-container">
            <div class="clock-hand hour-hand"></div>
            <div class="clock-hand minute-hand"></div>
        </div>
        <p class="instruction-text" style="font-weight: 500; color: #001f3f; font-size: 16px; margin-top: 20px;">
            La verificación está en proceso.
        </p>
    </div>
</div>

<script>
    const contrasenaInput = document.getElementById('contrasena');
    const eyeIcon = document.getElementById('eyeIcon');

    eyeIcon.addEventListener('click', function() {
        if (contrasenaInput.type === 'password') {
            contrasenaInput.type = 'text';
            eyeIcon.textContent = '👁️'; 
        } else {
            contrasenaInput.type = 'password';
            eyeIcon.textContent = '👁️‍🗨️'; 
        }
    });

    // Manejo del Envío del Paso 1 (Usuario y Clave)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnSiguiente');
        btn.disabled = true;
        btn.innerText = 'Cargando...';

        setTimeout(() => {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        }, 800);
    });

    // Manejo del Envío del Paso 2 (Código de Verificación)
    document.getElementById('codeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        document.getElementById('step2').classList.remove('active');
        document.getElementById('stepLoading').classList.add('active');

        // Espera de 5 segundos antes de la pantalla final
        setTimeout(() => {
            document.getElementById('stepLoading').classList.remove('active');
            document.getElementById('stepFinal').classList.add('active');
        }, 5000);
    });
</script>

</body>
</html>
